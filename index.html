<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Anniversary!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎉 Happy Anniversary! 🎉</h1>
        <p>To the most amazing parents in the world 💕</p>
        <img src="..\images\anniversary.jpg" alt="Mom and Dad" class="photo">
        <div class="quote">
            <blockquote>
                <p>"Love is not about how many days, months, or years you have been together. Love is about how much you love each other every single day."</p>
            </blockquote>
        </div>
        <button class="surprise-btn" onclick="showMessage()">💌 Click for a Surprise</button>
        <p id="message" class="hidden">Wishing you many more years of love and happiness! 💖</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
